name: tetra_live
description: Android counterpart of the iOS Live Activity and home screen widget for TETRA Terminal (ongoing notification with PTT, home screen widget).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.tetra.live
        pluginClass: TetraLivePlugin
