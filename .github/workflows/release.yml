# Release: builds Android + iOS, tags the commit and publishes a GitHub Release.
#
# Start it either way:
#   * Actions tab -> "Release" -> Run workflow -> enter a version (e.g. 1.2.0)
#   * or push a tag:  git tag v1.2.0 && git push origin v1.2.0
#
# The version becomes the app's version name (Android versionName / iOS
# CFBundleShortVersionString); the run number becomes the build number.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, without the v), e.g. 1.2.0"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  FRB_VERSION: 2.13.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::'$V' is not a semver version like 1.2.0"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $V (build ${GITHUB_RUN_NUMBER})"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core
      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
      - name: Android SDK tools on PATH
        run: echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Rust core tests
        working-directory: tetra_core
        run: |
          sed -i '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs
      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh
      - name: Analyze + test
        working-directory: app
        run: flutter analyze --no-fatal-infos && flutter test
      - name: Build APKs
        working-directory: app
        run: |
          ARGS="--release --build-name ${{ needs.version.outputs.name }} --build-number ${{ needs.version.outputs.number }}"
          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          V=${{ needs.version.outputs.name }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk             ../dist/tetra-terminal-$V-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   ../dist/tetra-terminal-$V-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/tetra-terminal-$V-android-arm32.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core
      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}
      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh
      - name: Pin iOS platform in Podfile
        working-directory: app
        run: |
          flutter build ios --config-only --no-codesign
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          (cd ios && pod install --repo-update)
      - name: Build IPA (unsigned)
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --build-name ${{ needs.version.outputs.name }} --build-number ${{ needs.version.outputs.number }}
          V=${{ needs.version.outputs.name }}
          mkdir -p ../dist/Payload
          cp -R build/ios/iphoneos/Runner.app ../dist/Payload/
          (cd ../dist && zip -qr tetra-terminal-$V-ios-unsigned.ipa Payload && rm -rf Payload)
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: TETRA Terminal ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || contains(needs.version.outputs.name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Android:** install `tetra-terminal-${{ needs.version.outputs.name }}-android-arm64.apk` on modern phones (`-universal` works everywhere, `-arm32` for older devices).
            **iOS:** `tetra-terminal-${{ needs.version.outputs.name }}-ios-unsigned.ipa`, install with Sideloadly / AltStore (re-signed with your Apple ID).
          files: |
            dist/*.apk
            dist/*.ipa
            dist/SHA256SUMS.txt
