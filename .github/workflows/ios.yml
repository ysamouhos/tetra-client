# Builds the iOS app on GitHub's macOS runners.
# Outputs (Actions run page -> Artifacts):
#   tetra-terminal-unsigned.ipa  sideload with Sideloadly / AltStore (free Apple ID re-signs it, 7-day validity)
#   tetra-terminal-simulator     Runner.app for the iOS Simulator
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass in the Live Activity needs the iOS 26 SDK (Xcode 26).
      # Picks the newest Xcode 26 on the runner; keeps the default otherwise.
      - name: Select Xcode
        continue-on-error: true
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@2.13.0

      - name: Rust core tests
        working-directory: tetra_core
        run: |
          # frb_generated.rs is created by codegen in the next step; tests do not need it.
          sed -i '' '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs

      - name: App setup (platform folders, Rust bridge, bindings)
        working-directory: app
        run: |
          chmod +x tool/setup.sh
          ./tool/setup.sh

      - name: Analyze + test
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Pin iOS platform in Podfile
        working-directory: app
        run: |
          # Generates ios/Podfile (and the Xcode config) without a full build.
          flutter build ios --config-only --no-codesign
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          grep -n "^platform" ios/Podfile
          (cd ios && pod install --repo-update)

      - name: Live Activity + home screen widget extension
        id: widgets
        continue-on-error: true
        working-directory: app
        run: |
          cp -R ios ../ios-without-widgets
          bash ios_widgets/install.sh

      - name: Build for device (unsigned)
        id: device
        continue-on-error: true
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Build for device without the widget extension (fallback)
        if: steps.device.outcome == 'failure'
        working-directory: app
        run: |
          echo "::warning::The build with the Live Activity / widget extension failed (see the step above). Building the app without it."
          rm -rf ios build/ios && cp -R ../ios-without-widgets ios
          flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: app
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ -d "$APP/PlugIns/TetraWidgets.appex" ]; then
            # Ad-hoc signature carrying the App Group entitlements, so tools that
            # re-sign the IPA (Sideloadly, AltStore) can keep them for the widget.
            ( set +e
              for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done
              codesign --force --sign - --entitlements ios/TetraWidgets/TetraWidgets.entitlements "$APP/PlugIns/TetraWidgets.appex" &&
              codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP" ) || echo "::warning::Ad-hoc signing failed; the IPA is unsigned."
          fi
          mkdir -p ../out/Payload
          cp -R build/ios/iphoneos/Runner.app ../out/Payload/
          cd ../out && zip -qr tetra-terminal-unsigned.ipa Payload

      - name: Build for Simulator
        working-directory: app
        run: flutter build ios --simulator --debug

      - uses: actions/upload-artifact@v4
        with:
          name: tetra-terminal-unsigned-ipa
          path: out/tetra-terminal-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: tetra-terminal-simulator
          path: app/build/ios/iphonesimulator/Runner.app
