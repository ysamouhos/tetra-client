# Builds a signed iOS app and uploads it to TestFlight.
#
# Start it: Actions tab -> "TestFlight" -> Run workflow (or push a tag tf-*).
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secrets
#     APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID (Users and Access -> Integrations, role: Admin)
#     APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown on the same page
#     APP_STORE_CONNECT_KEY_BASE64   the downloaded AuthKey_XXXX.p8, base64-encoded (base64 -i AuthKey_XXXX.p8 | pbcopy)
#     APPLE_TEAM_ID                  10-character Team ID (developer.apple.com -> Membership)
#   Variables (optional)
#     IOS_BUNDLE_ID                  defaults to org.tetra.terminal.tetraTerminal
#
# Also create the app record in App Store Connect with the same bundle ID.
# Signing uses the API: each run creates a temporary distribution certificate
# and App Store profiles (app + .TetraWidgets), and revokes/deletes them afterwards.
# One-time: register App Group group.<bundle id> on developer.apple.com and
# assign it to both identifiers (the API cannot create App Groups).
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["tf-*"]

env:
  FRB_VERSION: 2.13.0
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'org.tetra.terminal.tetraTerminal' }}

jobs:
  testflight:
    # Self-hosted Mac (Yianniss-MacBook-Air). Needs Xcode, CocoaPods (Homebrew)
    # and rustup; Flutter is downloaded by the workflow. The step below lists
    # anything missing with the command to install it.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Runner prerequisites (Xcode, CocoaPods, Rust)
        run: |
          missing=()
          # Xcode via DEVELOPER_DIR, so no sudo xcode-select is needed.
          x=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -n "$x" ]; then
            echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version
          else
            missing+=("Xcode: install it from the App Store, open it once and accept the license")
          fi
          for d in /opt/homebrew/bin "$HOME/.cargo/bin"; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          if command -v pod >/dev/null && [ -d "$(brew --prefix cocoapods 2>/dev/null)/libexec" ]; then
            # xcodeproj gem (used by ios_widgets and the signing step) from Homebrew's CocoaPods.
            echo "GEM_HOME=$(brew --prefix cocoapods)/libexec" >> "$GITHUB_ENV"
            echo "/opt/homebrew/opt/ruby/bin" >> "$GITHUB_PATH"
            pod --version
          else
            missing+=("CocoaPods: brew install cocoapods")
          fi
          command -v rustup >/dev/null || missing+=("Rust: brew install rustup && rustup-init -y")
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::Missing on this runner: $m"; done
            exit 1
          fi

      - name: Check secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY_ID ISSUER KEY_B64 TEAM; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see the header of testflight.yml)"; exit 1; }
          done

      # Fails fast (before the long build) with a plain explanation of which
      # API key secret is wrong. Never prints secret values.
      - name: Verify App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby - <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'; require 'net/http'
          def fail!(m); puts "::error::#{m}"; exit 1; end
          key_id = ENV['KEY_ID'].to_s; issuer = ENV['ISSUER'].to_s; team = ENV['TEAM'].to_s
          [[key_id, 'APP_STORE_CONNECT_KEY_ID'], [issuer, 'APP_STORE_CONNECT_ISSUER_ID'], [team, 'APPLE_TEAM_ID']].each do |v, n|
            fail!("#{n} has leading/trailing whitespace or quotes; re-enter it with the bare value.") if v != v.strip || v =~ /["']/
          end
          fail!("APP_STORE_CONNECT_KEY_ID should be 10 letters/digits (length #{key_id.length}); use only the ID, without AuthKey_ or .p8.") unless key_id =~ /\A[A-Z0-9]{10}\z/
          fail!("APP_STORE_CONNECT_ISSUER_ID should be a UUID like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (from the Team Keys page), not the Team ID.") unless issuer =~ /\A\h{8}-\h{4}-\h{4}-\h{4}-\h{12}\z/i
          fail!("APPLE_TEAM_ID should be 10 letters/digits (length #{team.length}).") unless team =~ /\A[A-Z0-9]{10}\z/
          pem = begin
            Base64.decode64(ENV['KEY_B64'].to_s.gsub(/\s/, ''))
          rescue => e
            fail!("APP_STORE_CONNECT_KEY_BASE64 is not valid base64 (#{e.class}).")
          end
          if pem.include?('BEGIN PRIVATE KEY') == false
            hint = ENV['KEY_B64'].to_s.include?('BEGIN PRIVATE KEY') ? ' It looks like you pasted the raw .p8 text; paste the base64 output instead.' : ''
            fail!("APP_STORE_CONNECT_KEY_BASE64 does not decode to a .p8 private key.#{hint}")
          end
          key = begin
            OpenSSL::PKey.read(pem)
          rescue => e
            fail!("The decoded .p8 could not be parsed as a private key (#{e.message}); re-encode the original file.")
          end
          fail!("The .p8 is not an EC (ES256) key; is it an App Store Connect API key?") unless key.is_a?(OpenSSL::PKey::EC)
          puts "Key file OK, Key ID / Issuer ID / Team ID formats OK."
          b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
          now = Time.now.to_i
          input = b64.(JSON.generate(alg: 'ES256', kid: key_id, typ: 'JWT')) + '.' +
                  b64.(JSON.generate(iss: issuer, iat: now, exp: now + 600, aud: 'appstoreconnect-v1'))
          der = key.sign(OpenSSL::Digest::SHA256.new, input)
          r, s = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\0")[-32, 32] }
          jwt = "#{input}.#{b64.(r + s)}"
          uri = URI('https://api.appstoreconnect.apple.com/v1/bundleIds?limit=1')
          req = Net::HTTP::Get.new(uri); req['Authorization'] = "Bearer #{jwt}"
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          case res.code
          when '200'
            puts "App Store Connect accepted the key (HTTP 200)."
            # Register the app + widget bundle IDs (what Xcode's signing does
            # first) and show Apple's own error if that is refused.
            api = lambda do |method, path, body = nil|
              u = URI("https://api.appstoreconnect.apple.com#{path}")
              r = (method == :post ? Net::HTTP::Post : Net::HTTP::Get).new(u)
              r['Authorization'] = "Bearer #{jwt}"; r['Content-Type'] = 'application/json'
              r.body = JSON.generate(body) if body
              Net::HTTP.start(u.host, u.port, use_ssl: true) { |h| h.request(r) }
            end
            base = ENV['BUNDLE_ID'].to_s
            [[base, 'TETRA Terminal'], ["#{base}.TetraWidgets", 'TETRA Terminal Widgets']].each do |id, name|
              g = api.(:get, "/v1/bundleIds?filter[identifier]=#{URI.encode_www_form_component(id)}&limit=5")
              if JSON.parse(g.body)['data'].to_a.any? { |d| d.dig('attributes', 'identifier') == id }
                puts "Bundle ID #{id}: registered in your team."
                next
              end
              p = api.(:post, '/v1/bundleIds', { data: { type: 'bundleIds', attributes: { identifier: id, name: name, platform: 'IOS' } } })
              if p.code == '201'
                puts "Bundle ID #{id}: registered now."
              else
                detail = (JSON.parse(p.body)['errors'] || []).map { |e| "#{e['code']}: #{e['detail']}" }.join(' | ') rescue p.body[0, 400]
                hint = detail =~ /not available|already/i ? ' This ID belongs to another developer team; set the IOS_BUNDLE_ID repository variable to an ID of your own (e.g. com.yourname.tetraterminal).' : ''
                hint = ' Accept the pending agreements in App Store Connect (Business) and on developer.apple.com.' if detail =~ /agreement/i
                fail!("Apple refused to register bundle ID #{id} (HTTP #{p.code}): #{detail}.#{hint}")
              end
            end
          when '401' then fail!("App Store Connect rejected the key (401). The Key ID, Issuer ID and .p8 file are well-formed but don't belong together: the .p8 must be the file downloaded for exactly this Key ID, and the Issuer ID must come from the Team Keys page. Or the key was revoked.")
          when '403' then fail!("The key is valid but lacks permission (403). Use a Team key with the Admin role. #{res.body[0, 300]}")
          else fail!("Unexpected response HTTP #{res.code}: #{res.body[0, 300]}")
          end
          RUBY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}

      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh

      - name: Configure Xcode project (bundle ID, team, Podfile)
        working-directory: app
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter build ios --config-only --no-codesign
          P=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = org\.tetra\.terminal\.tetraTerminal([.;])/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}\1/g" "$P"
          # Put the team on every build configuration of every target.
          sed -i '' -E "/DEVELOPMENT_TEAM = /d" "$P"
          TEAM="$TEAM" perl -pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM};/g' "$P"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM" "$P"
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          (cd ios && pod install --repo-update)

      - name: Live Activity + widget extension
        working-directory: app
        run: bash ios_widgets/install.sh

      - name: App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # Kept in the run temp dir (not ~/.appstoreconnect) so nothing stays on the Mac.
          D="$RUNNER_TEMP/asc_keys"; mkdir -p "$D"; chmod 700 "$D"
          echo "$KEY_B64" | base64 -d > "$D/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$D/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$D" >> "$GITHUB_ENV"

      # Distribution certificate + App Store profiles via the API (no Xcode
      # automatic signing). Both are temporary and removed in "Signing cleanup".
      - name: Signing setup (certificate, profiles, keychain)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export KEY_PATH="$ASC_KEY_PATH" OUT="$RUNNER_TEMP/signing"
          ruby .github/scripts/asc_signing.rb setup
          cat "$OUT/signing.env" >> "$GITHUB_ENV"
          source "$OUT/signing.env"

          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$OUT/dist_key.pem" -A -k "$KC"
          security import "$OUT/dist.cer" -k "$KC"
          SIGN_HASH=$(openssl x509 -inform der -in "$OUT/dist.cer" -noout -fingerprint -sha1 | sed "s/.*=//; s/://g")
          echo "SIGN_HASH=$SIGN_HASH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$OUT/dist_key.pem"
          security find-identity -v -p codesigning "$KC"

          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH" "$d/"
          done
          for p in "$APP_PROFILE_PATH" "$WIDGET_PROFILE_PATH"; do
            security cms -D -i "$p" > "$p.plist"
            if ! grep -q "group.${BUNDLE_ID}<" "$p.plist"; then
              echo "::error::The profile for $(basename "$p" .mobileprovision) does not include the App Group group.${BUNDLE_ID}. On developer.apple.com -> Identifiers: register the App Group group.${BUNDLE_ID}, then open ${BUNDLE_ID} and ${BUNDLE_ID}.TetraWidgets, tick App Groups -> Configure -> select that group, Save. Then run this workflow again."
              exit 1
            fi
          done
          echo "Profiles include the App Group."

      - name: Use manual signing in the Xcode project
        working-directory: app/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby -rxcodeproj -e '
            p = Xcodeproj::Project.open("Runner.xcodeproj")
            { "Runner" => ENV["APP_PROFILE_NAME"], "TetraWidgets" => ENV["WIDGET_PROFILE_NAME"] }.each do |t, prof|
              target = p.targets.find { |x| x.name == t } or abort("no target #{t}")
              target.build_configurations.each do |c|
                s = c.build_settings
                s["CODE_SIGN_STYLE"] = "Manual"
                s["DEVELOPMENT_TEAM"] = ENV["TEAM"]
                s["CODE_SIGN_IDENTITY"] = ENV["SIGN_HASH"]
                s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = ENV["SIGN_HASH"]
                s["OTHER_CODE_SIGN_FLAGS"] = "--keychain #{ENV["KEYCHAIN_PATH"]}"
                s["PROVISIONING_PROFILE_SPECIFIER"] = prof
              end
            end
            p.save'

      - name: Flutter release build (no codesign)
        working-directory: app
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          BUILD=$(( $(date +%s) / 60 ))   # monotonic build number
          echo "Version $VERSION ($BUILD)"
          flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$BUILD"

      - name: Archive + export IPA (manual signing)
        working-directory: app/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_HASH}</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${APP_PROFILE_NAME}</string>
              <key>${BUNDLE_ID}.TetraWidgets</key><string>${WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          # altool finds the key through API_PRIVATE_KEYS_DIR.
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --output-format normal
          echo "Uploaded. The build appears in TestFlight after Apple finishes processing (usually 5-30 min)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

      - name: Signing cleanup (revoke certificate, delete profiles)
        if: always()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          [ -f "${ASC_KEY_PATH:-/nonexistent}" ] || exit 0  # key is removed in the next step
          KEY_PATH="$ASC_KEY_PATH" OUT="$RUNNER_TEMP/signing" ruby .github/scripts/asc_signing.rb cleanup
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            rm -f "$d/app.mobileprovision" "$d/widget.mobileprovision"
          done

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc_keys" "$RUNNER_TEMP/signing"
