# Builds a signed iOS app and uploads it to TestFlight.
#
# Start it: Actions tab -> "TestFlight" -> Run workflow (or push a tag tf-*).
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secrets
#     APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID (Users and Access -> Integrations, role: Admin)
#     APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown on the same page
#     APP_STORE_CONNECT_KEY_BASE64   the downloaded AuthKey_XXXX.p8, base64-encoded (base64 -i AuthKey_XXXX.p8 | pbcopy)
#     APPLE_TEAM_ID                  10-character Team ID (developer.apple.com -> Membership)
#   Variables (optional)
#     IOS_BUNDLE_ID                  defaults to org.tetra.terminal.tetraTerminal
#
# Also create the app record in App Store Connect with the same bundle ID.
# Signing is automatic: Xcode creates the distribution certificate and
# provisioning profiles (app + .TetraWidgets extension, App Group) with the API key.
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["tf-*"]

env:
  FRB_VERSION: 2.13.0
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'org.tetra.terminal.tetraTerminal' }}

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        continue-on-error: true
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - name: Check secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY_ID ISSUER KEY_B64 TEAM; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see the header of testflight.yml)"; exit 1; }
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@${{ env.FRB_VERSION }}

      - name: App setup
        working-directory: app
        run: chmod +x tool/setup.sh && ./tool/setup.sh

      - name: Configure Xcode project (bundle ID, team, Podfile)
        working-directory: app
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter build ios --config-only --no-codesign
          P=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = org\.tetra\.terminal\.tetraTerminal([.;])/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}\1/g" "$P"
          # Put the team on every build configuration of every target.
          sed -i '' -E "/DEVELOPMENT_TEAM = /d" "$P"
          TEAM="$TEAM" perl -pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM};\n\t\t\t\tCODE_SIGN_STYLE = Automatic;/g' "$P"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM" "$P"
          sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          grep -q "^platform :ios" ios/Podfile || { printf "platform :ios, '15.0'\n" | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile; }
          (cd ios && pod install --repo-update)

      - name: Live Activity + widget extension
        working-directory: app
        run: bash ios_widgets/install.sh

      - name: App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Flutter release build (no codesign)
        working-directory: app
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          BUILD=$(( $(date +%s) / 60 ))   # monotonic build number
          echo "Version $VERSION ($BUILD)"
          flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$BUILD"

      - name: Archive + export (automatic signing)
        working-directory: app/ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded to App Store Connect; the build appears in TestFlight after processing."

      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect
