# Builds the Android app on the self-hosted runner labelled "runner1".
# Outputs (Actions run page -> Artifacts): tetra-terminal-android (debug-signed APKs, for testing).
# Signed release builds are produced by release.yml.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: runner1
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: the legacy `tools` package no longer exists.
          packages: ""

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tetra_core

      - name: Cache flutter_rust_bridge_codegen
        id: frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: cargo install --locked flutter_rust_bridge_codegen@2.13.0

      - name: Rust core tests
        working-directory: tetra_core
        run: |
          # frb_generated.rs is created by codegen in the next step; tests do not need it.
          sed -i '/^mod frb_generated;/d' src/lib.rs
          cargo test -q
          git checkout src/lib.rs

      - name: App setup (platform folders, Rust bridge, bindings)
        working-directory: app
        run: |
          chmod +x tool/setup.sh
          ./tool/setup.sh

      - name: Analyze + test
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APKs
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: tetra-terminal-android
          path: app/build/app/outputs/flutter-apk/*.apk
