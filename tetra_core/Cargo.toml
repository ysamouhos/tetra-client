[package]
name = "tetra_core"
version = "0.1.0"
edition = "2024"

[lib]
# lib for tests/tools, cdylib for Android (.so), staticlib for iOS (.a)
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3.34"
hex = "0.4.3"
log = "0.4.35"
md-5 = "0.11.0"
rand = "0.10.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"

[build-dependencies]
cc = "1.11.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
